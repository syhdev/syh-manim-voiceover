[project]
name = "manim-voiceover"
version = "0.4.1"
description = "Manim plugin for all things voiceover"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "The Manim Community Developers", email = "contact@manim.community" },
]
keywords = [
    "text-to-speech",
    "tts",
    "voiceover",
    "manim",
    "recording",
    "speech synthesis",
    "math animations",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
]
dependencies = [
    "manim",
    "sox>=1.5.0,<2",
    "python-dotenv>=1.2.4",
    "mutagen>=1.48.1",
    "pydub>=0.25.1",
    "pip>=26.2.1",
    "pydantic>=2.14.1",
    "python-slugify>=9.1.3",
]

[project.optional-dependencies]
azure = ["azure-cognitiveservices-speech>=1.52.0"]
# gtts = ["gTTS>=2.5.4"]
openai = ["openai>=3.29.0"]
pyttsx3 = ["pyttsx3>=2.99"]
# recorder = ["PyAudio>=0.2.12", "pynput>=1.8.2"]
translate = ["deepl>=1.32.0"]
elevenlabs = ["elevenlabs>=2.72.0"]
gemini = ["google-genai>=2.30.1"]
transcribe = ["openai-whisper>=20250625", "stable-ts>=2.19.1"]
all = [
    "azure-cognitiveservices-speech>=1.52.0",
    # "gTTS>=2.5.4",
    "pyttsx3>=2.99",
    # "PyAudio>=0.2.12",
    # "pynput>=1.8.2,<2",
    "openai>=3.29.0",
    "deepl>=1.32.0",
    "openai-whisper>=20250625",
    "stable-ts>=2.19.1",
    "elevenlabs>=2.72.0",
    "google-genai>=2.30.1",
]

[project.urls]
Repository = "https://github.com/ManimCommunity/manim-voiceover"
Homepage = "https://voiceover.manim.community"
Documentation = "https://voiceover.manim.community"

[project.scripts]
manim_translate = "manim_voiceover.translate.translate:main"
manim_render_translation = "manim_voiceover.translate.render:main"

[project.entry-points."manim.plugins"]
manim_voiceover = "manim_voiceover"

[dependency-groups]
dev = [
    "Pygments>=2.21.0",
    "azure-cognitiveservices-speech>=1.52.0",
    "deepl>=1.32.0",
    "elevenlabs>=2.72.0",
    # "gTTS>=2.5.4",
    "ipdb>=0.13.13,<0.14",
    "mutmut>=3.8.0",
    "openai>=3.29.0",
    "pip-audit>=2.10.1",
    # "PyAudio==0.2.12",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    # "pynput>=1.8.2",
    "pyttsx3>=2.99",
    "pylint>=4.1.3",
    "ruff>=0.17.0",
    "Sphinx>=9.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxext-opengraph>=0.13.0",
    "furo>=2025.12.19",
    "recommonmark>=0.7.1",
    "matplotlib>=3.11.2",
    "pre-commit>=4.7.0",
    "gitpython>=3.2.0",
    "google-genai>=2.30.1",
    "pygithub>=2.10.0",
    "isort>=9.0.2",
    "pytest-xdist>=3.8.0",
    "mypy>=2.4.0",
    "types-requests>=2.33.0.20261006",
    "types-python-slugify>=8.0.2.20240310",
    "sphinxcontrib-programoutput>=0.20",
    "psutil>=7.2.2",
    "sphinxcontrib-video==0.4.2",
    "sphinx-sitemap>=2.9.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 127
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["docs", "examples", "mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "C90", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that execute external tools or full workflows",
    "network: tests that require outbound network access",
]

[tool.coverage.run]
source = ["src/manim_voiceover"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mutmut]
source_paths = ["src/manim_voiceover"]

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true
files = ["src/manim_voiceover"]

# These dependencies do not ship usable type information for the supported
# version range. Keep missing-import ignores scoped to those external
# boundaries instead of weakening all project imports.
[[tool.mypy.overrides]]
module = [
    "azure.*",
    "elevenlabs",
    "gtts",
    "pyaudio",
    "pydub",
    "pydub.*",
    "pyttsx3",
    "google.*",
    "scipy.interpolate",
    "sox",
]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/manim_voiceover"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
